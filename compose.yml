services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${LEDGERLY_DB_NAME:-ledgerly}
      POSTGRES_USER: ${LEDGERLY_DB_USER:-ledgerly}
      POSTGRES_PASSWORD: ${LEDGERLY_DB_PASSWORD:-ledgerly_dev}
    ports:
      - "${LEDGERLY_DB_PORT:-5432}:5432"
    volumes:
      - ledgerly_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: ledgerly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${LEDGERLY_RABBITMQ_USER:-ledgerly}
      RABBITMQ_DEFAULT_PASS: ${LEDGERLY_RABBITMQ_PASSWORD:-ledgerly_dev}
    ports:
      - "${LEDGERLY_RABBITMQ_PORT:-5672}:5672"
      - "${LEDGERLY_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ledgerly_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ledgerly_postgres_data:
  ledgerly_rabbitmq_data:
